<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#1f4a6e"/>
      <stop offset="0.6" stop-color="#11263f"/>
      <stop offset="1" stop-color="#08111f"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0b0"/>
      <stop offset="0.45" stop-color="#e5b94c"/>
      <stop offset="1" stop-color="#8f5f17"/>
    </linearGradient>
    <linearGradient id="tray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2a1a"/>
      <stop offset="1" stop-color="#1a110a"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f6f96"/>
      <stop offset="1" stop-color="#16324d"/>
    </linearGradient>
    <linearGradient id="tileWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a3a5a"/>
      <stop offset="1" stop-color="#341327"/>
    </linearGradient>
    <linearGradient id="tileGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f7a5a"/>
      <stop offset="1" stop-color="#143424"/>
    </linearGradient>
    <radialGradient id="pool" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd36b" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffd36b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7fc4ff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#7fc4ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#fff6d0" opacity="0.8">
    <circle cx="30" cy="40" r="1.6"/><circle cx="372" cy="330" r="1.8"/><circle cx="118" cy="30" r="1.4"/>
    <circle cx="344" cy="34" r="1.4"/><circle cx="24" cy="330" r="1.8"/><circle cx="380" cy="150" r="1.4"/>
    <circle cx="60" cy="120" r="1.4"/>
  </g>

  <ellipse cx="200" cy="200" rx="190" ry="150" fill="url(#aura)"/>
  <ellipse cx="200" cy="318" rx="185" ry="26" fill="url(#pool)"/>

  <!-- the dock: a gold-edged tray -->
  <rect x="20" y="198" width="360" height="104" rx="18" fill="url(#tray)" stroke="#3a2306" stroke-width="10"/>
  <rect x="20" y="198" width="360" height="104" rx="18" fill="none" stroke="url(#gold)" stroke-width="5"/>

  <!-- tile 1: speech bubble -->
  <g transform="translate(36,214)">
    <rect width="72" height="72" rx="12" fill="url(#tile)" stroke="#05090f" stroke-width="4"/>
    <path d="M14,18 h44 a6,6 0 0 1 6,6 v22 a6,6 0 0 1 -6,6 h-24 l-12,10 v-10 h-8 a6,6 0 0 1 -6,-6 v-22 a6,6 0 0 1 6,-6 z"
          fill="url(#gold)" stroke="#3a2306" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- tile 2: open book -->
  <g transform="translate(116,214)">
    <rect width="72" height="72" rx="12" fill="url(#tileGreen)" stroke="#05090f" stroke-width="4"/>
    <path d="M36,24 C28,18 18,18 10,20 V54 C18,52 28,52 36,58 C44,52 54,52 62,54 V20 C54,18 44,18 36,24 Z"
          fill="url(#gold)" stroke="#3a2306" stroke-width="3" stroke-linejoin="round"/>
    <path d="M36,24 V58" stroke="#3a2306" stroke-width="3"/>
  </g>

  <!-- tile 3: a mask, waiting for you (gold border, glowing) -->
  <g transform="translate(196,214)">
    <rect width="72" height="72" rx="12" fill="#ffd36b" opacity="0.5" filter="url(#glow)"/>
    <rect width="72" height="72" rx="12" fill="url(#tileWarm)" stroke="url(#gold)" stroke-width="6"/>
    <path d="M12,22 C24,16 48,16 60,22 C62,40 52,58 36,60 C20,58 10,40 12,22 Z"
          fill="url(#gold)" stroke="#3a2306" stroke-width="3" stroke-linejoin="round"/>
    <path d="M20,34 q6,-6 12,0 M40,34 q6,-6 12,0" fill="none" stroke="#3a2306" stroke-width="4" stroke-linecap="round"/>
    <path d="M26,46 q10,8 20,0" fill="none" stroke="#3a2306" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- empty slot, waiting for the tile coming in -->
  <rect x="278" y="216" width="68" height="68" rx="12" fill="#0b1726" fill-opacity="0.6"
        stroke="#e5b94c" stroke-width="3" stroke-dasharray="9 7" opacity="0.8"/>

  <!-- the handle: grip with a gold pip -->
  <rect x="352" y="214" width="20" height="72" rx="6" fill="#5a4024" stroke="#3a2306" stroke-width="3"/>
  <g stroke="#e5b94c" stroke-width="3" stroke-linecap="round">
    <path d="M358,236 h8"/><path d="M358,250 h8"/><path d="M358,264 h8"/>
  </g>

  <!-- a tile flying into the dock -->
  <g stroke="#fff0b0" stroke-width="5" stroke-linecap="round" opacity="0.55">
    <path d="M270,40 L282,92"/><path d="M300,28 L310,82"/><path d="M330,40 L336,92"/>
  </g>
  <g transform="translate(312,148) rotate(12)">
    <rect x="-38" y="-38" width="76" height="76" rx="13" fill="url(#tile)" stroke="#05090f" stroke-width="4"/>
    <!-- a star -->
    <path d="M0,-26 L7,-8 L26,-8 L11,4 L17,23 L0,12 L-17,23 L-11,4 L-26,-8 L-7,-8 Z"
          fill="url(#gold)" stroke="#3a2306" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <!-- arrow into the slot -->
  <path d="M312,192 l-9,-10 m9,10 l9,-10" fill="none" stroke="#fff0b0" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

  <!-- sparkles -->
  <g fill="#fff6d0">
    <path d="M70,92 l4,12 l12,4 l-12,4 l-4,12 l-4,-12 l-12,-4 l12,-4 z"/>
    <path d="M200,120 l3,9 l9,3 l-9,3 l-3,9 l-3,-9 l-9,-3 l9,-3 z"/>
    <path d="M130,340 l2.5,7.5 l7.5,2.5 l-7.5,2.5 l-2.5,7.5 l-2.5,-7.5 l-7.5,-2.5 l7.5,-2.5 z"/>
  </g>
  <g fill="#7fc4ff" filter="url(#glow)">
    <circle cx="40" cy="170" r="3.5"/><circle cx="366" cy="360" r="3"/><circle cx="160" cy="60" r="2.5"/>
  </g>
</svg>
